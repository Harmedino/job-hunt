name: Validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  checks:
    # MongoDB 8 rejects Linux kernels >= 6.19; Ubuntu 22.04's supported
    # runner image uses 6.8. Avoid moving latest-image kernels in DB tests.
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cv
      - run: npm run test:builder
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - run: npm run test:auth
      - run: npm run test:e2e
