name: Discover jobs
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-job-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_HUNT_URL: ${{ secrets.JOB_HUNT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$JOB_HUNT_URL" && -n "$CRON_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Discovery skipped. Configure JOB_HUNT_URL and CRON_SECRET in repository Actions secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - name: Run discovery
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ "$JOB_HUNT_URL" != https://* ]]; then
            echo "JOB_HUNT_URL must use HTTPS."
            exit 1
          fi
          bash scripts/discover.sh > "$RUNNER_TEMP/job-discovery.json"
          node - "$RUNNER_TEMP/job-discovery.json" <<'JS'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(result.successfulSources) || result.successfulSources.length === 0) {
            console.error('No job source responded successfully. Check deployment connectivity.');
            process.exit(1);
          }
          console.log(`Discovery completed: ${result.jobs.length} jobs from ${result.successfulSources.length} sources.`);
          if (result.failures?.length) console.warn('Some sources were unavailable. See deployment logs.');
          JS
